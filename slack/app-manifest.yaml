# Slack app manifest for the Enterprise developer sandbox.
# api.slack.com/apps → Create New App → From a manifest → pick the sandbox org.
display_information:
  name: Onboarding Buddy
  description: Fleetwing Express (fictional) onboarding assistant, hackathon demo
  background_color: "#4d148c"
features:
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: Onboarding Buddy
    always_online: true
  slash_commands:
    - command: /onboard
      description: Start and manage worker onboarding cases
      usage_hint: start "Name" email | status | plan FW-001 | approve FW-001 v1 | invite FW-001
      should_escape: false
oauth_config:
  scopes:
    bot:
      - commands
      - chat:write
      - im:write
      - users:read
      - users:read.email
      - channels:read
      - channels:manage
      - groups:write
      - im:history
      - app_mentions:read
    user:
      - admin.users:write
settings:
  event_subscriptions:
    bot_events:
      - team_join
      - message.im
      - app_mention
  interactivity:
    is_enabled: true
  org_deploy_enabled: true
  socket_mode_enabled: true
  token_rotation_enabled: false
