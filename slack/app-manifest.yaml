# Chat bot: install in the Fleetwing demo workspace.
# Workspace invitations use the separate provisioning-app-manifest.yaml app.
display_information:
  name: Fleetwing Onboarding Agent
  description: Onboards new Fleetwing couriers (fictional demo)
  background_color: "#14181B"
features:
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: Fleetwing Onboarding Agent
    always_online: true
  slash_commands:
    - command: /onboard
      description: Start and manage worker onboarding cases
      usage_hint: start "Name" email | status | plan FW-001 | approve FW-001 v1 | invite FW-001
      should_escape: false
oauth_config:
  scopes:
    bot:
      - commands
      - chat:write
      - im:write
      - users:read
      - users:read.email
      - channels:read
      - channels:manage
      - groups:write
      - im:history
      - app_mentions:read
      - files:read
settings:
  event_subscriptions:
    bot_events:
      - team_join
      - message.im
      - app_mention
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
